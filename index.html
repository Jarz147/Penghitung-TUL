<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Lembur TUL - Pajar Ardianto</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <div id="loginSection" class="login-section">
        <div class="card">
            <h3>Login</h3>
            <div class="input-group">
                <label>Nama</label>
                <select id="loginNama">
                    <option value="Arif Mustaqim">Arif Mustaqim</option>
                    <option value="Handaka Primasta">Handaka Primasta</option>
                    <option value="Muhammad Yusuf bin mahmud">Muhammad Yusuf bin mahmud</option>
                    <option value="Dikdik abdul aziz">Dikdik abdul aziz</option>
                    <option value="Wawan Gianto">Wawan Gianto</option>
                    <option value="Aryo Setioko">Aryo Setioko</option>
                    <option value="Wisnu Ernandi">Wisnu Ernandi</option>
                    <option value="Nur Rohmat">Nur Rohmat</option>
                    <option value="Budi Irawan">Budi Irawan</option>
                    <option value="Pajar Ardianto">Pajar Ardianto</option>
                    <option value="Iwan Prasetyo">Iwan Prasetyo</option>
                    <option value="Azkia Rasya Ikbar">Azkia Rasya Ikbar</option>
                    <option value="Irwan Bagustian">Irwan Bagustian</option>
                    <option value="Randika Septian">Randika Septian</option>
                    <option value="Achmad Shobirin">Achmad Shobirin</option>
                </select>
            </div>
            <div class="input-group">
                <label>NPK (sebagai PIN)</label>
                <input type="password" id="loginPin" placeholder="Masukkan NPK">
            </div>
            <button onclick="handleLogin()">Masuk</button>
        </div>
    </div>

    <div class="container" id="appSection" style="display:none;">
        <header>
            <div class="summary-card">
                <div class="filter-section">
                    <label>Pilih Periode History:</label>
                    <select id="pilihPeriode" onchange="onPeriodeChanged()"></select>
                </div>
                <p id="labelPeriode">Menghitung periode...</p>
                <div id="headerStats">
                    <h1 id="totalTULBesar">0</h1>
                    <span>TOTAL TUL PERIODE INI</span>
                </div>
                <button type="button" class="btn-klasemen" id="btnKlasemen" onclick="bukaKlasemen()">KLASEMEN</button>
            </div>
        </header>
        
        <main id="viewInput">
            <div class="card">
                <h3>Input Lembur</h3>
                <div class="input-group">
                    <label>Nama Karyawan</label>
                    <select id="nama" onchange="renderData()">
                        <option value="Arif Mustaqim">Arif Mustaqim</option>
                        <option value="Handaka Primasta">Handaka Primasta</option>
                        <option value="Muhammad Yusuf bin mahmud">Muhammad Yusuf bin mahmud</option>
                        <option value="Dikdik abdul aziz">Dikdik abdul aziz</option>
                        <option value="Wawan Gianto">Wawan Gianto</option>
                        <option value="Aryo Setioko">Aryo Setioko</option>
                        <option value="Wisnu Ernandi">Wisnu Ernandi</option>
                        <option value="Nur Rohmat">Nur Rohmat</option>
                        <option value="Budi Irawan">Budi Irawan</option>
                        <option value="Pajar Ardianto">Pajar Ardianto</option>
                        <option value="Iwan Prasetyo">Iwan Prasetyo</option>
                        <option value="Azkia Rasya Ikbar">Azkia Rasya Ikbar</option>
                        <option value="Irwan Bagustian">Irwan Bagustian</option>
                        <option value="Randika Septian">Randika Septian</option>
                        <option value="Achmad Shobirin">Achmad Shobirin</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Tanggal</label>
                    <input type="date" id="tanggal">
                </div>
                <div class="input-group">
                    <label>Jenis Lembur</label>
                    <select id="jenisLembur">
                        <option value="Lembur Akhir">Lembur Akhir</option>
                        <option value="Lembur Awal">Lembur Awal</option>
                        <option value="HOT">HOT</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Detail Pekerjaan</label>
                    <input type="text" id="detailPekerjaan" placeholder="Contoh: Setting mesin, meeting, dsb.">
                </div>
                <div class="input-group">
                    <label>Durasi Lembur (Jam)</label>
                    <select id="durasi">
                        <option value="0.5">0.5 Jam</option>
                        <option value="1">1 Jam</option>
                        <option value="1.5">1.5 Jam</option>
                        <option value="2">2 Jam</option>
                        <option value="2.5">2.5 Jam</option>
                        <option value="3">3 Jam</option>
                        <option value="3.5">3.5 Jam</option>
                        <option value="4">4 Jam</option>
                        <option value="4.5">4.5 Jam</option>
                        <option value="5">5 Jam</option>
                        <option value="5.5">5.5 Jam</option>
                        <option value="6">6 Jam</option>
                        <option value="6.5">6.5 Jam</option>
                        <option value="7">7 Jam</option>
                        <option value="7.5">7.5 Jam</option>
                        <option value="8" selected>8 Jam</option>
                    </select>
                </div>
                <button onclick="tambahData()" id="btnSimpan">Simpan Data</button>
            </div>

            <div class="history">
                <div class="table-container">
                    <table id="tabelLembur">
                        <thead>
                            <tr>
                                <th>Tgl</th>
                                <th>Jenis / Detail</th>
                                <th>Jam</th>
                                <th>TUL</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </main>

        <section id="viewKlasemen" class="view-klasemen" style="display:none;" aria-label="Klasemen TUL">
            <div class="card card-klasemen">
                <h3>Klasemen — total TUL semua nama</h3>
                <p class="klasemen-hint">Data mengikuti periode yang dipilih di atas.</p>
                <div class="chart-wrap">
                    <canvas id="grafikLembur" aria-label="Grafik batang total TUL per nama"></canvas>
                </div>
                <button type="button" class="btn-kembali" onclick="tutupKlasemen()">Kembali ke input</button>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
